# Continuous integration: builds the TypeScript, runs the tests (no network, no server), types and the check of what would go to npm, for every package
# (sdk, cli, studio, studio-core, studio-kit, studio-mcp). Studio needs ffmpeg in the voice/render tests; runs on Linux and macOS (Windows: best effort, not tested yet).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: npm ci
      - run: npm run build:sdk   # tsc: dist/ with JS and .d.ts of @praeko/sdk (`npm ci` already builds via `prepare`; here it fails explicitly)
      - run: npm run build:studio   # esbuild + tsc: dist/ of @praeko/studio, studio-core, studio-kit and studio-mcp
      - run: npm test
      - run: npm run typecheck
      - run: npm run release:check
